[package]
name = "tap"
version = "0.1.0"
edition = "2021"
authors = ["Thalix Inc"]
description = "Traceable Acceptance Pack (TAP): Claims → Use Cases → Acceptance Tests"
repository = "https://github.com/thalixinc/tap"
license = "MIT"
keywords = ["requirements", "traceability", "testing", "design", "agent"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "tap"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.3.24", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
include_dir = "0.7"
is-terminal = "0.4"
